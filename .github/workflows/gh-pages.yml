name: GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=npm depName=npm
  NPM_VERSION: "12.2.2"

  WASM_SHARED_KEY: wasm-rs-v1

jobs:
  check-diff:
    name: Check Differences
    runs-on: ubuntu-slim
    outputs:
      changes: ${{ steps.filter.outputs.source }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check Sources
        uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            source:
              - 'fonts/**'
              - 'js/**'
              - 'rs/**'
              - 'scripts/**'
              - 'scss/**'
              - 'src/**'
              - 'theme/**'
              - 'book.toml'

  cache-media-files:
    name: Cache Media Files
    runs-on: ubuntu-slim
    if: ${{ github.ref == 'refs/heads/main' }}
    outputs:
      cache-key: ${{ steps.set-cache-key.outputs.cache-key }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          lfs: false
          fetch-depth: 1
          sparse-checkout: |
            src

      - name: Set Cache Key
        id: set-cache-key
        run: |
          digest=$(
            git ls-files -s -z -- \
              'src/*.avif' 'src/**/*.avif' \
              'src/*.jxl' 'src/**/*.jxl' \
              'src/*.mp3' 'src/**/*.mp3' \
              'src/*.webm' 'src/**/*.webm' \
              'src/*.webp' 'src/**/*.webp' |
            sha256sum |
            cut -d' ' -f1
          )
          echo "cache-key=$digest" >> "$GITHUB_OUTPUT"

      - name: Restore Media Cache (allow partial match)
        id: cache-media
        uses: actions/cache/restore@v6.1.0
        with:
          path: tmp-media
          key: media-${{ steps.set-cache-key.outputs.cache-key }}
          restore-keys: |
            media-

      - name: Pull LFS Files
        if: steps.cache-media.outputs.cache-hit != 'true'
        run: |
          git lfs pull --include="src/**/*.avif,src/**/*.jxl,src/**/*.mp3,src/**/*.webm,src/**/*.webp"

      - name: Synchronize Media Files
        if: steps.cache-media.outputs.cache-hit != 'true'
        run: |
          rm -rf tmp-media
          mkdir -p tmp-media
          rsync -a --delete \
            --include='*/' \
            --include='*.avif' \
            --include='*.jxl' \
            --include='*.mp3' \
            --include='*.webm' \
            --include='*.webp' \
            --exclude='*' \
            src/ tmp-media

      - name: Save Media Cache
        if: steps.cache-media.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: tmp-media
          key: media-${{ steps.set-cache-key.outputs.cache-key }}

  test-wasm:
    name: Test Wasm
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            rs/wasm

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          target: wasm32-unknown-unknown
          cache-workspaces: rs/wasm
          cache-shared-key: ${{ env.WASM_SHARED_KEY }}

      - name: Install Wasm Pack
        uses: taiki-e/install-action@v2.90.3
        with:
          tool: wasm-pack

      - name: Test Wasm
        working-directory: rs/wasm
        run: |
          wasm-pack test --headless --firefox

  build-wasm:
    name: Build Wasm
    runs-on: ubuntu-26.04-arm
    needs: test-wasm
    env:
      # renovate: datasource=github-releases depName=wasm-bindgen/wasm-bindgen
      WASM_BINDGEN_VERSION: "0.2.130"
      # renovate: datasource=github-releases depName=WebAssembly/binaryen extractVersion=^version_(?<version>\d+)$
      BINARYEN_VERSION: "133"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            rs/wasm

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          target: wasm32-unknown-unknown
          cache-workspaces: rs/wasm
          cache-shared-key: ${{ env.WASM_SHARED_KEY }}

      - name: Install Wasm Bindgen
        uses: taiki-e/install-action@v2.90.3
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }}

      - name: Build Wasm
        working-directory: rs/wasm
        run: |
          cargo build --release --target wasm32-unknown-unknown

          wasm-bindgen \
            ./target/wasm32-unknown-unknown/release/wasm_book.wasm \
            --target web \
            --out-dir pkg

      - name: Install Binaryen
        run: |
          curl -fL --retry 10 "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-aarch64-linux.tar.gz" -o binaryen.tar.gz
          curl -fL --retry 10 "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-aarch64-linux.tar.gz.sha256" -o binaryen.sha256
          echo "$(cut -d' ' -f1 binaryen.sha256)  binaryen.tar.gz" | sha256sum -c -

          tar xzf binaryen.tar.gz
          echo "$PWD/binaryen-version_${BINARYEN_VERSION}/bin" >> $GITHUB_PATH

      - name: Optimize Wasm
        working-directory: rs/wasm
        run: |
          wasm-opt ./pkg/wasm_book_bg.wasm \
            -O \
            --enable-simd \
            --enable-nontrapping-float-to-int \
            --enable-bulk-memory \
            --strip-debug \
            --strip-producers \
            --strip-dwarf \
            -o ./pkg/wasm_book_bg.opt.wasm

          mv ./pkg/wasm_book_bg.opt.wasm ./pkg/wasm_book_bg.wasm

      - name: Upload Wasm Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wasm-book
          path: rs/wasm/pkg
          if-no-files-found: error
          retention-days: 1

  test-js:
    name: Test JS
    runs-on: ubuntu-slim
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            js

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      - name: Update npm
        run: |
          npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install Dependencies
        working-directory: js
        run: |
          npm ci

      - name: Run Vitest
        working-directory: js
        run: |
          npm run test:ci

      - name: Upload Vitest Report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vitest-report
          path: js/coverage
          if-no-files-found: ignore
          retention-days: 1

  build-js:
    name: Build JS
    runs-on: ubuntu-slim
    needs: [test-js, build-wasm]
    env:
      # renovate: datasource=npm depName=typescript
      TYPESCRIPT_VERSION: "7.0.2"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            js

      - name: Download Wasm Package
        uses: actions/download-artifact@v8.0.2
        with:
          name: wasm-book
          path: pkg

      - name: Copy Wasm Bindings
        run: |
          cp pkg/wasm_book.js js
          cp pkg/wasm_book.d.ts js

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      - name: Update npm
        run: |
          npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install Dependencies
        working-directory: js
        run: |
          npm ci

      - name: Type check
        working-directory: js
        run: |
          npx -p typescript@${TYPESCRIPT_VERSION} tsc --noEmit

      - name: Build
        working-directory: js
        run: |
          npm run bundle

      - name: Upload JS Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-js
          path: js/dist
          if-no-files-found: error
          retention-days: 1

  build-scss:
    name: Build SCSS
    runs-on: ubuntu-slim
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            scss

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      - name: Update npm
        run: |
          npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install Dependencies
        working-directory: scss
        run: |
          npm ci

      - name: Build SCSS
        working-directory: scss
        run: |
          npm run build

      - name: Upload CSS Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: css
          path: scss/dist
          if-no-files-found: error
          retention-days: 1

  convert-woff2:
    name: Convert WOFF2
    runs-on: ubuntu-slim
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            fonts

      - name: Cache Woff2
        id: cache-woff2
        uses: actions/cache@v6.1.0
        with:
          path: fonts/woff2
          key: python-${{ runner.os }}-fonts-${{ hashFiles('fonts/**') }}

      - name: Setup Uv
        if: steps.cache-woff2.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.x"
          enable-cache: "false"

      - name: Download And Convert
        if: steps.cache-woff2.outputs.cache-hit != 'true'
        run: ./fonts/download.sh

      - name: Upload Font Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: woff2
          path: fonts/woff2
          if-no-files-found: error
          retention-days: 1

  test-mdbook-backend:
    name: Test mdBook Backend
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            rs/mdbook-footnote

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache-workspaces: rs/mdbook-footnote

      - name: Test Cargo (mdbook footnote)
        working-directory: rs/mdbook-footnote
        run: |
          cargo test --verbose

  publish:
    name: Publish
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.check-diff.outputs.changes == 'true'
    runs-on: ubuntu-26.04-arm
    needs:
      - build-wasm
      - build-js
      - build-scss
      - cache-media-files
      - check-diff
      - convert-woff2
      - test-mdbook-backend
    env:
      # renovate: datasource=github-releases depName=rust-lang/mdBook
      MDBOOK_VERSION: "0.5.4"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false # Make it clear (just in case) that lfs is not used in this step.
          sparse-checkout: |
            book.toml
            rs/mdbook-footnote
            scripts
            src
            theme

      - name: Restore Media Cache
        id: cache-media
        uses: actions/cache@v6.1.0
        with:
          path: tmp-media
          key: media-${{ needs.cache-media-files.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Remove LFS Pointer
        run: find src -type f \( -name '*.avif' -o -name '*.jxl' -o -name '*.mp3' -o -name '*.webp' -o -name '*.webm' \) -delete

      - name: Populate Media Files
        run: |
          rsync -a tmp-media/ src/
          rm -rf tmp-media

      - name: Download All Artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts

      - name: Copy Files
        run: |
          cp artifacts/wasm-book/wasm_book_bg.wasm src
          cp artifacts/build-js/* src
          cp -r artifacts/woff2 src
          cp -r artifacts/css src

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache-workspaces: |
            rs/mdbook-footnote -> target

      - name: Install Mdbook
        run: |
          cargo install mdbook --version ${MDBOOK_VERSION}

          #cargo install mdbook-admonish
          cargo install --git https://github.com/CoralPink/mdbook-admonish.git --branch mdbook-v0.5.x

          cargo install mdbook-tailor
          cargo install --path ./rs/mdbook-footnote

      - name: Setup Pages
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        id: pages
        uses: actions/configure-pages@v6.0.0

      - name: Build Book
        run: |
          mdbook build --dest-dir commentary

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      - name: Update npm
        run: |
          npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install Dependencies
        working-directory: scripts
        run: |
          npm ci

      - name: Run Regenerate
        working-directory: commentary
        run: |
          npm --prefix ../scripts run regenerate

      - name: Compress Search Index
        working-directory: commentary
        run: |
          brotli searchindex.json
          gzip --best --keep --no-name searchindex.json

      - name: Remove Unneeded Files
        working-directory: commentary
        run: |
          rm ayu-highlight.css
          rm book.js
          rm clipboard.min.js
          rm elasticlunr.min.js
          rm fonts.css
          rm highlight.css
          rm highlight.js
          rm mark.min.js
          rm searcher.js
          rm searchindex.js
          rm searchindex.json
          rm toc.html
          rm toc.js
          rm tomorrow-night.css
          rm css/chrome.css
          rm css/variables.css
          rm -rf FontAwesome
          rm -rf fonts

      - name: Upload Pages Artifact
        id: deployment
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: commentary

  deploy:
    name: Deploy
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.check-diff.outputs.changes == 'true'
    runs-on: ubuntu-slim
    needs:
      - check-diff
      - publish
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
